syntax = "proto3";

package geminichat;

// 定義聊天服務
service ChatService {
    // 傳送訊息的方法
    rpc SendMessage (ChatMessage) returns (ChatReply) {}
}

// 客戶端傳送的訊息格式
message ChatMessage {
    string text = 1;
    string user_id = 2;
    string platform = 3; // 來源平台，例如 "line", "console"
    LineMetadata line_metadata = 4; // LINE 專屬的中繼資料
    string user_display_name = 5; // LINE 用戶的顯示名稱
    string user_profile_json = 6; // LINE 用戶的完整個人資料 JSON 字串
}

// LINE 訊息的專屬中繼資料
message LineMetadata {
    string reply_token = 1;
    string message_json = 2; // 新增：整個 LINE event.message 的 JSON 字串
}

// 伺服器回傳的訊息格式
message ChatReply {
    string text = 1;
}
